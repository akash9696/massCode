name: Build AkashCode macOS

on:
  push:
    branches:
      - build/akashcode-macos
      - feature/markdown-appearance
      - feature/note-attachments
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=6144"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test AkashCode note features
        run: pnpm exec vitest run src/renderer/components/notes/__tests__/noteFragments.test.ts src/shared/__tests__/markdownAppearance.test.ts src/renderer/components/notes/__tests__/theme.test.ts src/shared/__tests__/noteAttachments.test.ts

      - name: Prepare AkashCode dev source
        run: |
          rm -rf dev-package
          mkdir -p dev-package
          git archive HEAD | tar -x -C dev-package

      - name: Upload AkashCode dev source
        uses: actions/upload-artifact@v4
        with:
          name: AkashCode-dev-source
          path: dev-package/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Build AkashCode for macOS
        run: pnpm build:akashcode:mac:arm64

      - name: List build outputs
        run: ls -lah dist-akashcode

      - name: Upload AkashCode installers
        uses: actions/upload-artifact@v4
        with:
          name: AkashCode-macOS
          path: |
            dist-akashcode/*.dmg
            dist-akashcode/*.zip
          if-no-files-found: error
          retention-days: 14
